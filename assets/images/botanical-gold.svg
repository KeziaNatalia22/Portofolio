<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C5A059" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9E7836" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Main curved stem -->
  <path d="M 450 550 C 400 480 360 380 340 280 C 320 180 350 90 380 20" stroke-width="2.5" />
  
  <!-- Secondary branching stems -->
  <path d="M 360 380 C 290 350 220 370 170 410" stroke-width="1.8" />
  <path d="M 335 250 C 270 210 210 230 150 270" stroke-width="1.8" />
  <path d="M 345 150 C 290 110 230 115 180 140" stroke-width="1.8" />
  <path d="M 365 70 C 330 40 290 45 250 60" stroke-width="1.5" />

  <!-- Lower large floral blossom -->
  <g transform="translate(170, 410)">
    <!-- Petals -->
    <path d="M 0 0 C -40 -30 -70 -10 -60 30 C -50 70 -10 60 0 0 Z" fill="url(#petalGrad)" stroke-width="1.5" />
    <path d="M 0 0 C -20 -60 30 -70 50 -40 C 70 -10 40 30 0 0 Z" fill="url(#petalGrad)" stroke-width="1.5" />
    <path d="M 0 0 C 40 -40 80 -10 70 30 C 60 70 20 50 0 0 Z" fill="url(#petalGrad)" stroke-width="1.5" />
    <path d="M 0 0 C 30 40 0 80 -30 70 C -60 60 -40 20 0 0 Z" fill="url(#petalGrad)" stroke-width="1.5" />
    <path d="M 0 0 C -60 10 -80 -40 -40 -60 C 0 -80 20 -40 0 0 Z" fill="url(#petalGrad)" stroke-width="1.5" />
    <!-- Flower Center Stamen -->
    <circle cx="0" cy="0" r="8" fill="#C5A059" fill-opacity="0.6" stroke-width="1.2" />
    <line x1="0" y1="0" x2="-8" y2="-12" stroke-width="1" />
    <line x1="0" y1="0" x2="10" y2="-10" stroke-width="1" />
    <line x1="0" y1="0" x2="-10" y2="8" stroke-width="1" />
    <line x1="0" y1="0" x2="8" y2="12" stroke-width="1" />
  </g>

  <!-- Middle floral blossom -->
  <g transform="translate(150, 270)">
    <path d="M 0 0 C -30 -20 -50 0 -40 30 C -30 50 0 40 0 0 Z" fill="url(#petalGrad)" stroke-width="1.3" />
    <path d="M 0 0 C -10 -45 30 -50 40 -20 C 50 0 20 25 0 0 Z" fill="url(#petalGrad)" stroke-width="1.3" />
    <path d="M 0 0 C 30 -30 60 0 45 30 C 30 50 10 35 0 0 Z" fill="url(#petalGrad)" stroke-width="1.3" />
    <circle cx="0" cy="0" r="6" fill="#C5A059" fill-opacity="0.5" stroke-width="1" />
  </g>

  <!-- Upper delicate flower bud -->
  <g transform="translate(180, 140)">
    <path d="M 0 0 C -25 -20 -35 10 -20 30 C -5 40 10 20 0 0 Z" fill="url(#petalGrad)" stroke-width="1.2" />
    <path d="M 0 0 C 5 -30 35 -30 30 -5 C 25 15 10 20 0 0 Z" fill="url(#petalGrad)" stroke-width="1.2" />
    <circle cx="0" cy="0" r="4" fill="#C5A059" fill-opacity="0.5" stroke-width="1" />
  </g>

  <!-- Delicate leaves along stem -->
  <path d="M 380 440 C 430 430 460 460 450 490 C 420 500 390 470 380 440 Z" fill="url(#petalGrad)" stroke-width="1.3" />
  <path d="M 350 320 C 400 300 430 320 420 350 C 390 360 360 340 350 320 Z" fill="url(#petalGrad)" stroke-width="1.3" />
  <path d="M 330 200 C 375 170 400 185 395 215 C 370 230 340 215 330 200 Z" fill="url(#petalGrad)" stroke-width="1.3" />
  <path d="M 350 100 C 390 75 410 85 405 110 C 385 125 360 115 350 100 Z" fill="url(#petalGrad)" stroke-width="1.2" />

  <!-- Shimmering Star accents -->
  <g transform="translate(390, 180)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#F2DFB8" fill-opacity="0.8" stroke="none" />
  </g>
  <g transform="translate(130, 360)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#F2DFB8" fill-opacity="0.7" stroke="none" />
  </g>
  <g transform="translate(260, 80)">
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#F2DFB8" fill-opacity="0.6" stroke="none" />
  </g>
</svg>
